<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shivalik Producers Collaborative - Master GIS Map</title>

<!-- Leaflet GIS Engine -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root {
    --brand: #1b4332;
    --accent: #2d6a4f;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body, html { height: 100%; width: 100%; overflow: hidden; }

  #map { height: 100%; width: 100%; z-index: 1; }

  .floating-panel {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(4px);
    border-radius: 10px;
    padding: 12px 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.18);
    max-width: 380px;
    border: 1px solid var(--border);
  }
  .floating-panel h1 { font-size: 1.05rem; color: var(--brand); font-weight: 700; margin-bottom: 2px; }
  .floating-panel p { font-size: 0.75rem; color: #475569; margin-bottom: 8px; }
  .stat-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 0.72rem;
    font-weight: 700;
    background: #e8f5e9;
    color: #1b4332;
    border: 1px solid #c8e6c9;
    margin-right: 4px;
  }

  .leaflet-popup-content { font-size: 0.82rem; line-height: 1.45; min-width: 250px; max-width: 320px; }
  .popup-header { background: var(--brand); color: #fff; margin: -14px -20px 10px -20px; padding: 10px 14px; border-radius: 4px 4px 0 0; }
  .popup-header h3 { font-size: 0.95rem; margin-bottom: 2px; }
  .popup-header div { font-size: 0.72rem; color: #b7e4c7; }
  .badge-cert { display: inline-block; background: #059669; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; margin-bottom: 6px; }
  .data-row { margin-bottom: 5px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 3px; }
  .data-row:last-child { border-bottom: none; }
  .data-label { font-weight: 700; color: #1e293b; }
</style>
</head>
<body>

<div class="floating-panel">
  <h1>🌾 Shivalik Producers Collaborative Map</h1>
  <p>Shared Footprint: Ropar, Mohali, Panchkula & Foothills Belt</p>
  <div>
    <span class="stat-badge" id="lbl-total-farms">Plots: 0</span>
    <span class="stat-badge" id="lbl-total-acres">Acreage: 0.00 Ac</span>
  </div>
</div>

<div id="map"></div>

<script>
  // ⚠️ REPLACE WITH YOUR ACTIVE GOOGLE APPS SCRIPT /exec URL:
  const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxX5pR1pPwDPnUJuCwlDPzlS_0nGLggxlBAig741l-oqzcmX-VdFdQfvgwA6xmsPmTP/exec";

  const map = L.map('map', {
    center: [30.95, 76.51],
    zoom: 12,
    zoomControl: false
  });
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri Satellite &copy; Shivalik Collaborative GIS',
    maxZoom: 19
  }).addTo(map);

  const osmStreets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  });

  L.control.layers({
    "🛰️ Satellite Imagery": esriSat,
    "🗺️ Street Map": osmStreets
  }, null, { position: 'topright' }).addTo(map);

  const farmBoundsGroup = L.featureGroup().addTo(map);

  function loadFarms() {
    if (!API_ENDPOINT || API_ENDPOINT.includes("PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE")) {
      return;
    }

    fetch(API_ENDPOINT)
      .then(res => res.json())
      .then(data => {
        if (Array.isArray(data) && data.length > 0) {
          renderFarms(data);
        }
      })
      .catch(err => console.warn("Error loading farms:", err));
  }

  function renderFarms(farms) {
    farmBoundsGroup.clearLayers();
    let totalAcres = 0;
    let validCount = 0;

    farms.forEach(f => {
      let coords = [];
      try {
        if (typeof f['Boundary GeoJSON'] === 'string') {
          coords = JSON.parse(f['Boundary GeoJSON']);
        } else if (Array.isArray(f['Boundary GeoJSON'])) {
          coords = f['Boundary GeoJSON'];
        }
      } catch(e) {}

      if (Array.isArray(coords) && coords.length >= 3) {
        const polygon = L.polygon(coords, {
          color: '#00ff88',
          weight: 2.5,
          fillColor: '#00ff88',
          fillOpacity: 0.35
        });

        const acresNum = parseFloat(f['Parcel Acres'] || f['Total Acres']) || 0;
        totalAcres += acresNum;
        validCount++;

        const popupContent = `
          <div class="popup-header">
            <h3>${f['Farmer Name'] || 'Collaborative Member'}</h3>
            <div>${f['Parcel Identifier'] ? f['Parcel Identifier'] + ' &bull; ' : ''}${f['Village'] || ''}</div>
          </div>
          <div>
            <span class="badge-cert">${f['NPOP/PGS Status'] || 'Chemical-Free'}</span>
            <div class="data-row"><span class="data-label">Plot Size:</span> ${f['Parcel Acres'] || f['Total Acres'] || 'N/A'}</div>
            <div class="data-row"><span class="data-label">Collaboration Focus:</span> ${f['Legal Preference'] || 'Collective Partner'}</div>
            <div class="data-row"><span class="data-label">Primary Crops:</span> ${f['Primary Crops'] || 'N/A'}</div>
            <div class="data-row"><span class="data-label">Orchards / Trees:</span> ${f['Orchard/Horticulture Details'] || 'None'}</div>
            <div class="data-row"><span class="data-label">Soil & Irrigation:</span> ${f['Soil Organic Carbon (%)'] || ''} | ${f['Water Source'] || ''}</div>
            <div class="data-row"><span class="data-label">Shared Tool Pool:</span> ${f['Machinery Owned (CHC)'] || 'None listed'}</div>
          </div>
        `;

        polygon.bindPopup(popupContent);
        farmBoundsGroup.addLayer(polygon);

        if (f['GPS Lat'] && f['GPS Lng']) {
          const marker = L.circleMarker([parseFloat(f['GPS Lat']), parseFloat(f['GPS Lng'])], {
            radius: 5,
            color: '#ffffff',
            fillColor: '#00ff88',
            fillOpacity: 1,
            weight: 2
          });
          marker.bindPopup(popupContent);
          farmBoundsGroup.addLayer(marker);
        }
      }
    });

    document.getElementById('lbl-total-farms').innerText = `Plots: ${validCount}`;
    document.getElementById('lbl-total-acres').innerText = `Acreage: ${totalAcres.toFixed(2)} Ac`;

    if (farmBoundsGroup.getLayers().length > 0) {
      map.fitBounds(farmBoundsGroup.getBounds(), { padding: [40, 40] });
    }
  }

  loadFarms();
</script>

</body>
</html>
