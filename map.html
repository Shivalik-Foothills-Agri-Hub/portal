<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shivalik Producers Collaborative - Master GIS Map</title>

<!-- Leaflet GIS Engine -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root {
    --brand: #1b4332;
    --accent: #2d6a4f;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body, html { height: 100%; width: 100%; overflow: hidden; }

  #map { height: 100%; width: 100%; z-index: 1; }

  /* Floating UI Header */
  .floating-panel {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(4px);
    border-radius: 10px;
    padding: 12px 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.18);
    max-width: 390px;
    border: 1px solid var(--border);
  }
  .header-brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .map-logo {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #d4a373;
    box-shadow: 0 2px 5px rgba(0,0,0,0.25);
    flex-shrink: 0;
  }
  .floating-panel h1 { font-size: 1.05rem; color: var(--brand); font-weight: 700; margin: 0; }
  .floating-panel p { font-size: 0.74rem; color: #475569; margin: 2px 0 0 0; }
  
  .stat-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 0.72rem;
    font-weight: 700;
    background: #e8f5e9;
    color: #1b4332;
    border: 1px solid #c8e6c9;
    margin-right: 4px;
  }
  .kandi-btn-link {
    display: block;
    text-align: center;
    background: #dc2626;
    color: #ffffff !important;
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 0.74rem;
    font-weight: 700;
    text-decoration: none;
    margin-top: 8px;
    box-shadow: 0 2px 4px rgba(220, 38, 38, 0.3);
    transition: background 0.2s, transform 0.1s;
  }
  .kandi-btn-link:hover {
    background: #b91c1c;
    transform: translateY(-1px);
  }

  /* Custom Popup Styling */
  .leaflet-popup-content { font-size: 0.82rem; line-height: 1.45; min-width: 260px; max-width: 340px; }
  .popup-header { background: var(--brand); color: #fff; margin: -14px -20px 10px -20px; padding: 10px 14px; border-radius: 4px 4px 0 0; }
  .popup-header h3 { font-size: 0.95rem; margin-bottom: 2px; }
  .popup-header div { font-size: 0.72rem; color: #b7e4c7; }
  .badge-cert { display: inline-block; background: #059669; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; margin-bottom: 6px; }
  .data-row { margin-bottom: 5px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 3px; }
  .data-row:last-child { border-bottom: none; }
  .data-label { font-weight: 700; color: #1e293b; }
  .btn-report { display: inline-block; background: #0284c7; color: #fff; text-decoration: none; padding: 3px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: 600; margin-top: 4px; }
  .btn-report:hover { background: #0369a1; }
</style>
</head>
<body>

<div class="floating-panel">
  <div class="header-brand-row">
    <img src="logo.jpeg" alt="Community Circle Logo" class="map-logo" onerror="this.style.display='none'">
    <div>
      <h1>🌾 Shivalik Producers Collaborative</h1>
      <p>ਕਿਸਾਨ ਸਾਂਝ ਕੇਂਦਰ &bull; Unified Community Circle (Est. 2026)</p>
    </div>
  </div>

  <div style="margin-bottom: 4px;">
    <span class="stat-badge" id="lbl-total-farms">Plots: 0</span>
    <span class="stat-badge" id="lbl-total-acres">Acreage: 0.00 Ac</span>
  </div>
  
  <!-- Direct Clickable Government Portal Button -->
  <a href="https://punjab.gov.in/" target="_blank" class="kandi-btn-link">
    🏛️ View Official Punjab Govt Portal (Kandi Zone) ↗
  </a>
</div>

<div id="map"></div>

<script>
  // ⚠️ REPLACE WITH YOUR ACTIVE GOOGLE APPS SCRIPT /exec URL:
  const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxX5pR1pPwDPnUJuCwlDPzlS_0nGLggxlBAig741l-oqzcmX-VdFdQfvgwA6xmsPmTP/exec";

  // Center on the sub-mountainous Shivalik corridor
  const map = L.map('map', {
    center: [31.05, 76.45],
    zoom: 11,
    zoomControl: false
  });
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // Basemap Providers
  const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri Satellite &copy; Shivalik Collaborative GIS',
    maxZoom: 19
  }).addTo(map);

  const osmStreets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  });

  const farmBoundsGroup = L.featureGroup().addTo(map);

  // Official Notified Kandi Sub-Mountainous Tract Coordinates
  const kandiFootprintGeoJSON = {
    "type": "FeatureCollection",
    "features": [
      {
        "type": "Feature",
        "properties": {
          "name": "Punjab & Adjoining Kandi Sub-Mountainous Tract",
          "description": "Notified sub-mountainous agro-ecological zone covering Pathankot, Hoshiarpur, SBS Nagar, Rupnagar, Mohali & Panchkula foothills."
        },
        "geometry": {
          "type": "Polygon",
          "coordinates": [[
            [75.75, 32.45],
            [75.95, 32.30],
            [76.05, 32.05],
            [76.18, 31.75],
            [76.35, 31.45],
            [76.50, 31.25],
            [76.58, 31.05],
            [76.72, 30.88],
            [76.92, 30.75],
            [77.05, 30.60],
            [76.82, 30.55],
            [76.65, 30.75],
            [76.45, 30.95],
            [76.30, 31.15],
            [76.00, 31.45],
            [75.70, 31.75],
            [75.55, 32.15],
            [75.75, 32.45]
          ]]
        }
      }
    ]
  };

  // Styled Kandi Layer with Direct Government Link Inside Popup
  const kandiLayer = L.geoJSON(kandiFootprintGeoJSON, {
    style: {
      color: "#dc2626",
      weight: 2.5,
      dashArray: "6, 6",
      fillColor: "#f87171",
      fillOpacity: 0.12
    }
  }).bindPopup(`
    <div style="font-size:0.8rem; line-height:1.45;">
      <h4 style="color:#b91c1c; margin-bottom:4px;">📍 Notified Kandi Agro-Ecological Belt</h4>
      <p style="margin-bottom:6px; color:#334155;">
        Delineated sub-mountainous Shivalik foothill tract covering designated blocks of 
        <b>Pathankot, Hoshiarpur, SBS Nagar, Rupnagar (Ropar), SAS Nagar (Mohali)</b> and adjoining Panchkula fringes.
      </p>
      <div style="border-top:1px dashed #cbd5e1; padding-top:6px; font-size:0.74rem;">
        <b>Statutory References:</b><br>
        • Department of Soil & Water Conservation / Irrigation, Punjab<br>
        • Punjab Land Improvement & Kandi Watershed Project (KWADP)<br><br>
        <a href="https://punjab.gov.in/" target="_blank" style="color:#ffffff; background:#dc2626; padding:4px 8px; border-radius:4px; text-decoration:none; font-weight:700; display:inline-block;">
          🏛️ Visit Official Punjab Govt Portal ↗
        </a>
      </div>
    </div>
  `);

  kandiLayer.addTo(map);

  // Layer Selector Box (Top Right)
  L.control.layers({
    "🛰️ Satellite Imagery": esriSat,
    "🗺️ Street Map": osmStreets
  }, {
    "📍 Official Kandi Belt": kandiLayer,
    "🌾 Member Farm Boundaries": farmBoundsGroup
  }, { position: 'topright' }).addTo(map);

  function loadFarms() {
    if (!API_ENDPOINT || API_ENDPOINT.includes("PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE")) {
      return;
    }

    fetch(API_ENDPOINT)
      .then(res => res.json())
      .then(data => {
        if (Array.isArray(data) && data.length > 0) {
          renderFarms(data);
        }
      })
      .catch(err => console.warn("Error loading cluster plots:", err));
  }

  function renderFarms(farms) {
    farmBoundsGroup.clearLayers();
    let totalAcres = 0;
    let validCount = 0;

    farms.forEach(f => {
      let coords = [];
      try {
        if (typeof f['Boundary GeoJSON'] === 'string') {
          coords = JSON.parse(f['Boundary GeoJSON']);
        } else if (Array.isArray(f['Boundary GeoJSON'])) {
          coords = f['Boundary GeoJSON'];
        }
      } catch(e) {}

      if (Array.isArray(coords) && coords.length >= 3) {
        const polygon = L.polygon(coords, {
          color: '#00ff88',
          weight: 2.5,
          fillColor: '#00ff88',
          fillOpacity: 0.35
        });

        const acresNum = parseFloat(f['Parcel Acres'] || f['Total Acres']) || 0;
        totalAcres += acresNum;
        validCount++;

        const certVintageText = f['Cert Vintage (Practicing Since)'] ? `<br><small style="color:#64748b;">Practicing Since: ${f['Cert Vintage (Practicing Since)']}</small>` : '';
        const labReportLink = (f['Lab Report Drive Link'] && f['Lab Report Drive Link'].startsWith('http')) 
          ? `<div class="data-row"><a href="${f['Lab Report Drive Link']}" target="_blank" class="btn-report">📄 View Verified Lab Report</a></div>` 
          : '';

        const popupContent = `
          <div class="popup-header">
            <h3>${f['Farmer Name'] || 'Collaborative Member'}</h3>
            <div>${f['Parcel Identifier'] ? f['Parcel Identifier'] + ' &bull; ' : ''}${f['Village'] || ''}</div>
          </div>
          <div>
            <span class="badge-cert">${f['NPOP/PGS Status'] || 'Chemical-Free'}</span>
            ${certVintageText}
            <div class="data-row"><span class="data-label">Plot Size:</span> ${f['Parcel Acres'] || f['Total Acres'] || 'N/A'} (Total Holding: ${f['Total Farmer Acres'] || f['Total Acres'] || 'N/A'})</div>
            <div class="data-row"><span class="data-label">Collaboration Focus:</span> ${f['Collaboration Focus'] || f['Legal Preference'] || 'Active Working Partner'}</div>
            <div class="data-row"><span class="data-label">Primary Crops:</span> ${f['Primary Crops'] || 'N/A'}</div>
            <div class="data-row"><span class="data-label">Orchards / Trees:</span> ${f['Orchard/Horticulture Details'] || 'None'}</div>
            <div class="data-row"><span class="data-label">Soil & Water:</span> ${f['Soil Organic Carbon (%)'] || ''} | ${f['Water Source'] || ''}</div>
            <div class="data-row"><span class="data-label">Shared Tool Pool:</span> ${f['Machinery Owned (Pool)'] || f['Machinery Owned (CHC)'] || 'None listed'}</div>
            <div class="data-row"><span class="data-label">Farm Processing:</span> ${f['On-Farm Processing Facilities'] || 'None'}</div>
            ${labReportLink}
          </div>
        `;

        polygon.bindPopup(popupContent);
        farmBoundsGroup.addLayer(polygon);

        if (f['GPS Lat'] && f['GPS Lng']) {
          const marker = L.circleMarker([parseFloat(f['GPS Lat']), parseFloat(f['GPS Lng'])], {
            radius: 5,
            color: '#ffffff',
            fillColor: '#00ff88',
            fillOpacity: 1,
            weight: 2
          });
          marker.bindPopup(popupContent);
          farmBoundsGroup.addLayer(marker);
        }
      }
    });

    document.getElementById('lbl-total-farms').innerText = `Plots: ${validCount}`;
    document.getElementById('lbl-total-acres').innerText = `Acreage: ${totalAcres.toFixed(2)} Ac`;

    if (farmBoundsGroup.getLayers().length > 0) {
      map.fitBounds(farmBoundsGroup.getBounds(), { padding: [40, 40] });
    }
  }

  loadFarms();
</script>

</body>
</html>
