<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shivalik Foothills Innovative Farmers Hub - Master GIS Map</title>

<!-- Leaflet GIS Engine -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root {
    --brand: #1b4332;
    --accent: #2d6a4f;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body, html { height: 100%; width: 100%; overflow: hidden; }

  #map { height: 100%; width: 100%; z-index: 1; }

  .floating-panel {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(4px);
    border-radius: 10px;
    padding: 12px 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.22);
    max-width: 380px;
    border: 1px solid var(--border);
  }
  .header-brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .map-logo {
    height: 50px;
    width: auto;
    max-width: 90px;
    border-radius: 6px;
    object-fit: contain;
    border: 1.5px solid #d4a373;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    background: #2b1d0c;
    flex-shrink: 0;
  }
  .floating-panel h1 { font-size: 1.02rem; color: var(--brand); font-weight: 700; margin: 0; line-height: 1.25; }
  .floating-panel p { font-size: 0.74rem; color: #475569; margin: 2px 0 0 0; }
  
  .stats-row {
    margin-top: 6px;
    display: flex;
    gap: 6px;
  }
  .stat-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 0.72rem;
    font-weight: 700;
    background: #e8f5e9;
    color: #1b4332;
    border: 1px solid #c8e6c9;
  }

  /* Search Bar inside Floating Panel */
  .search-box-row {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .search-box-row input {
    flex: 1;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    font-size: 0.78rem;
    outline: none;
  }
  .search-box-row button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.76rem;
    font-weight: 700;
    cursor: pointer;
  }

  /* Permanent Farmer Plot Labels */
  .farmer-label-badge {
    background: rgba(15, 23, 42, 0.85) !important;
    border: 1.5px solid rgba(255, 255, 255, 0.95) !important;
    color: #ffffff !important;
    font-size: 0.72rem !important;
    font-weight: 700 !important;
    padding: 2px 8px !important;
    border-radius: 6px !important;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45) !important;
    white-space: nowrap !important;
    pointer-events: none !important;
    text-align: center;
    line-height: 1.25;
  }
  .farmer-label-badge::before { display: none !important; }
  .farmer-label-badge span {
    display: block;
    font-size: 0.62rem;
    color: #cbd5e1;
    font-weight: 500;
  }

  .leaflet-popup-content { font-size: 0.82rem; line-height: 1.45; min-width: 260px; max-width: 340px; }
  .popup-header { color: #fff; margin: -14px -20px 10px -20px; padding: 10px 14px; border-radius: 4px 4px 0 0; }
  .popup-header h3 { font-size: 0.95rem; margin-bottom: 2px; }
  .popup-header div { font-size: 0.72rem; color: #f1f5f9; }
  .badge-cert { display: inline-block; background: #059669; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; margin-bottom: 6px; }
  .data-row { margin-bottom: 5px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 3px; }
  .data-row:last-child { border-bottom: none; }
  .data-label { font-weight: 700; color: #1e293b; }
  .btn-report { display: inline-block; background: #0284c7; color: #fff; text-decoration: none; padding: 3px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: 600; margin-top: 4px; }
</style>
</head>
<body>

<div class="floating-panel">
  <div class="header-brand-row">
    <img src="logo.jpeg" alt="Community Circle Logo" class="map-logo" onerror="this.style.display='none'">
    <div>
      <h1>🌾 Shivalik Foothills Innovative Farmers Hub</h1>
      <p>ਕਿਸਾਨ ਸਾਂਝ ਕੇਂਦਰ &bull; Unified Community Circle (Est. 2026)</p>
    </div>
  </div>

  <div class="stats-row">
    <span class="stat-badge" id="lbl-total-farms">Plots: 0</span>
    <span class="stat-badge" id="lbl-total-acres">Acreage: 0.00 Ac</span>
  </div>

  <div class="search-box-row">
    <input type="text" id="villageQuery" placeholder="Search village (e.g. Nurpur Bedi, Ropar)">
    <button type="button" onclick="searchLocation()">🔍 Find</button>
  </div>
</div>

<div id="map"></div>

<script>
  // Active Google Apps Script URL:
  const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxX5pR1pPwDPnUJuCwlDPzlS_0nGLggxlBAig741l-oqzcmX-VdFdQfvgwA6xmsPmTP/exec";

  // Initialize Map directly at field zoom (14) centered on Rupnagar/Shivalik foothills
  const map = L.map('map', {
    center: [30.965, 76.530],
    zoom: 14,
    maxZoom: 22,
    zoomControl: false
  });
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // 1. High-Resolution Google Hybrid Satellite (Imagery + Field Paths)
  const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
    maxZoom: 22,
    maxNativeZoom: 20,
    attribution: '&copy; Google Satellite'
  }).addTo(map);

  // 2. Esri High-Resolution Satellite
  const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 22,
    maxNativeZoom: 19,
    attribution: 'Esri Satellite'
  });

  // 3. OpenStreetMap Streets
  const osmStreets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  });

  const farmBoundsGroup = L.featureGroup().addTo(map);

  const FARMER_PALETTE = [
    '#00f5d4', '#ffbe0b', '#fb5607', '#ff006e', 
    '#8338ec', '#3a86ff', '#06d6a0', '#e63946', 
    '#ffb703', '#52b788', '#a2d2ff', '#f72585'
  ];

  function getFarmerColor(identifier) {
    if (!identifier) return FARMER_PALETTE[0];
    let hash = 0;
    const str = String(identifier).trim().toLowerCase();
    for (let i = 0; i < str.length; i++) {
      hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    return FARMER_PALETTE[Math.abs(hash) % FARMER_PALETTE.length];
  }

  // Notified Kandi Sub-Mountainous Tract definition
  const kandiFootprintGeoJSON = {
    "type": "FeatureCollection",
    "features": [
      {
        "type": "Feature",
        "properties": { "name": "Punjab & Adjoining Kandi Sub-Mountainous Tract" },
        "geometry": {
          "type": "Polygon",
          "coordinates": [[
            [75.75, 32.45], [75.95, 32.30], [76.05, 32.05], [76.18, 31.75],
            [76.35, 31.45], [76.50, 31.25], [76.58, 31.05], [76.72, 30.88],
            [76.92, 30.75], [77.05, 30.60], [76.82, 30.55], [76.65, 30.75],
            [76.45, 30.95], [76.30, 31.15], [76.00, 31.45], [75.70, 31.75],
            [75.55, 32.15], [75.75, 32.45]
          ]]
        }
      }
    ]
  };

  const kandiLayer = L.geoJSON(kandiFootprintGeoJSON, {
    style: {
      color: "#dc2626",
      weight: 2.5,
      dashArray: "6, 6",
      fillColor: "#f87171",
      fillOpacity: 0.10
    }
  }).bindPopup(`
    <div style="font-size:0.8rem; line-height:1.45;">
      <h4 style="color:#b91c1c; margin-bottom:4px;">📍 Notified Kandi Agro-Ecological Belt</h4>
      <p style="margin-bottom:6px; color:#334155;">
        Delineated sub-mountainous Shivalik foothill tract covering designated blocks of 
        <b>Pathankot, Hoshiarpur, SBS Nagar, Rupnagar (Ropar), SAS Nagar (Mohali)</b> and adjoining Panchkula fringes.
      </p>
    </div>
  `);

  // Notice: kandiLayer is NOT added via .addTo(map) here, keeping it off by default.
  // It is available on-demand inside the layer switcher:
  L.control.layers({
    "🛰️ High-Res Satellite (Hybrid)": googleHybrid,
    "🛰️ Esri Satellite": esriSat,
    "🗺️ Street Map": osmStreets
  }, {
    "📍 Notified Kandi Belt (Reference)": kandiLayer,
    "🌾 Member Farm Boundaries": farmBoundsGroup
  }, { position: 'topright' }).addTo(map);

  function searchLocation() {
    const q = document.getElementById('villageQuery').value.trim();
    if (!q) return;
    const query = q.toLowerCase().includes("punjab") ? q : `${q}, Punjab, India`;

    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
      .then(res => res.json())
      .then(results => {
        if (results && results.length > 0) {
          const lat = parseFloat(results[0].lat);
          const lon = parseFloat(results[0].lon);
          map.setView([lat, lon], 16);
          L.popup()
            .setLatLng([lat, lon])
            .setContent(`<b>📍 ${results[0].display_name.split(',')[0]}</b>`)
            .openOn(map);
        } else {
          alert("Location not found. Try entering a nearby tehsil or landmark.");
        }
      })
      .catch(err => alert("Search error: " + err));
  }

  function loadFarms() {
    if (!API_ENDPOINT || API_ENDPOINT.includes("PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE")) return;

    fetch(API_ENDPOINT)
      .then(res => res.json())
      .then(data => {
        if (Array.isArray(data) && data.length > 0) {
          renderFarms(data);
        }
      })
      .catch(err => console.warn("Error loading cluster plots:", err));
  }

  function renderFarms(farms) {
    farmBoundsGroup.clearLayers();
    let totalAcres = 0;
    let validCount = 0;

    farms.forEach(f => {
      let coords = [];
      try {
        if (typeof f['Boundary GeoJSON'] === 'string') {
          coords = JSON.parse(f['Boundary GeoJSON']);
        } else if (Array.isArray(f['Boundary GeoJSON'])) {
          coords = f['Boundary GeoJSON'];
        }
      } catch(e) {}

      if (Array.isArray(coords) && coords.length >= 3) {
        const farmerName = f['Farmer Name'] || 'Hub Member';
        const farmerKey = f['Phone'] || farmerName;
        const color = getFarmerColor(farmerKey);

        const polygon = L.polygon(coords, {
          color: color,
          weight: 3,
          fillColor: color,
          fillOpacity: 0.45
        });

        const acresNum = parseFloat(f['Parcel Acres'] || f['Total Acres']) || 0;
        totalAcres += acresNum;
        validCount++;

        const parcelTag = f['Parcel Identifier'] || '';
        const badgeHTML = `<b>${farmerName}</b>${parcelTag ? `<span>${parcelTag} (${f['Parcel Acres'] || ''})</span>` : ''}`;

        polygon.bindTooltip(badgeHTML, {
          permanent: true,
          direction: 'center',
          className: 'farmer-label-badge'
        });

        const certVintageText = f['Cert Vintage (Practicing Since)'] ? `<br><small style="color:#64748b;">Practicing Since: ${f['Cert Vintage (Practicing Since)']}</small>` : '';
        const labReportLink = (f['Lab Report Drive Link'] && f['Lab Report Drive Link'].startsWith('http')) 
          ? `<div class="data-row"><a href="${f['Lab Report Drive Link']}" target="_blank" class="btn-report">📄 View Verified Lab Report</a></div>` 
          : '';

        const popupContent = `
          <div class="popup-header" style="background:${color};">
            <h3>${farmerName}</h3>
            <div>${parcelTag ? parcelTag + ' &bull; ' : ''}${f['Village'] || ''}</div>
          </div>
          <div style="padding-top:4px;">
            <span class="badge-cert">${f['NPOP/PGS Status'] || 'Chemical-Free'}</span>
            ${certVintageText}
            <div class="data-row"><span class="data-label">Plot Size:</span> ${f['Parcel Acres'] || f['Total Acres'] || 'N/A'} (Total Holding: ${f['Total Farmer Acres'] || f['Total Acres'] || 'N/A'})</div>
            <div class="data-row"><span class="data-label">Collaboration Focus:</span> ${f['Collaboration Focus'] || f['Legal Preference'] || 'Active Working Partner'}</div>
            <div class="data-row"><span class="data-label">Primary Crops:</span> ${f['Primary Crops'] || 'N/A'}</div>
            <div class="data-row"><span class="data-label">Orchards / Trees:</span> ${f['Orchard/Horticulture Details'] || 'None'}</div>
            <div class="data-row"><span class="data-label">Soil & Water:</span> ${f['Soil Organic Carbon (%)'] || ''} | ${f['Water Source'] || ''}</div>
            <div class="data-row"><span class="data-label">Shared Tool Pool:</span> ${f['Machinery Owned (Pool)'] || f['Machinery Owned (CHC)'] || 'None listed'}</div>
            <div class="data-row"><span class="data-label">Farm Processing:</span> ${f['On-Farm Processing Facilities'] || 'None'}</div>
            ${labReportLink}
          </div>
        `;

        polygon.bindPopup(popupContent);
        farmBoundsGroup.addLayer(polygon);

        if (f['GPS Lat'] && f['GPS Lng']) {
          const marker = L.circleMarker([parseFloat(f['GPS Lat']), parseFloat(f['GPS Lng'])], {
            radius: 5,
            color: '#ffffff',
            fillColor: color,
            fillOpacity: 1,
            weight: 2
          });
          marker.bindPopup(popupContent);
          farmBoundsGroup.addLayer(marker);
        }
      }
    });

    document.getElementById('lbl-total-farms').innerText = `Plots: ${validCount}`;
    document.getElementById('lbl-total-acres').innerText = `Acreage: ${totalAcres.toFixed(2)} Ac`;

    // Zoom directly to registered plots once loaded
    if (farmBoundsGroup.getLayers().length > 0) {
      map.fitBounds(farmBoundsGroup.getBounds(), { padding: [40, 40] });
    }
  }

  loadFarms();
</script>

</body>
</html>
